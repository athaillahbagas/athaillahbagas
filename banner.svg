<title id="title">Athaillah Bagas. Engineering at ITB.</title>
<desc id="description">A minimal typographic introduction to Athaillah Bagas, an engineering student at Institut Teknologi Bandung. The subtitle types three phrases: Exploring business and finance; Learning through building; Turning ideas into useful tools.</desc>
