<title id="title">Athaillah Bagas. Engineering at ITB.</title>
<desc id="description">A minimal typographic introduction to Athaillah Bagas, an engineering student at Institut Teknologi Bandung. The subtitle types three phrases: Business strategy. Structured problem solving. Turning analysis into decisions.</desc>
