name: Update contribution snake

on:
  schedule:
    - cron: '17 0 * * *' # Daily at 07:17 WIB; GitHub schedules can be delayed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#2f8f71
            dist/snake-dark.svg?palette=github-dark&color_snake=#85e0bb

      - name: Respect reduced motion
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          rule = '@media (prefers-reduced-motion: reduce){*{animation:none!important}}'
          for name in ('snake.svg', 'snake-dark.svg'):
              path = Path('dist') / name
              svg = path.read_text()
              assert '</style>' in svg, 'Expected CSS-based snake SVG'
              svg = svg.replace('</style>', rule + '</style>', 1)
              ET.fromstring(svg)
              path.write_text(svg)

      - name: Transfer generated assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contribution-snake
          path: dist/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Receive generated assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contribution-snake
          path: dist

      - name: Commit to output only when files change
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const repo = context.repo;
            const ref = 'heads/output';
            let parent;
            let baseTree;
            try {
              const result = await github.rest.git.getRef({ ...repo, ref });
              parent = result.data.object.sha;
              const commit = await github.rest.git.getCommit({ ...repo, commit_sha: parent });
              baseTree = commit.data.tree.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const tree = ['snake.svg', 'snake-dark.svg'].map(path => ({
              path,
              mode: '100644',
              type: 'blob',
              content: fs.readFileSync(`dist/${path}`, 'utf8')
            }));
            const result = await github.rest.git.createTree({
              ...repo,
              ...(baseTree ? { base_tree: baseTree } : {}),
              tree
            });
            if (result.data.sha === baseTree) {
              core.info('Contribution images unchanged; no commit needed.');
              return;
            }

            const commit = await github.rest.git.createCommit({
              ...repo,
              message: 'Update contribution snake',
              tree: result.data.sha,
              parents: parent ? [parent] : [],
              author: {
                name: 'github-actions[bot]',
                email: '41898282+github-actions[bot]@users.noreply.github.com'
              }
            });
            if (parent) {
              await github.rest.git.updateRef({
                ...repo, ref, sha: commit.data.sha, force: false
              });
            } else {
              await github.rest.git.createRef({
                ...repo, ref: `refs/${ref}`, sha: commit.data.sha
              });
            }
